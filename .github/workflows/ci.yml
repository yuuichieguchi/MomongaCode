name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install bubblewrap
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
          sudo sysctl --write kernel.apparmor_restrict_unprivileged_userns=0
      - run: npm ci
      - run: npm ci --prefix compliance/open-responses
      - run: npm run typecheck
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78
        if: runner.os != 'Windows'
        with:
          distribution: temurin
          java-version: '17'
      - name: Fetch the pinned TLC jar
        if: runner.os != 'Windows'
        run: scripts/tlc.sh --fetch-jar
      - name: Unit tests
        if: runner.os != 'Windows'
        run: npm test
      - name: Unit tests, without the TLC tier (it needs bash, ps and /usr/bin)
        if: runner.os == 'Windows'
        run: npx vitest run --project unit --exclude test/formal/tlc.test.ts
      - run: npm run test:e2e
      - run: npm run test:packaging

  compat-previous-release:
    name: compat-previous-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: node scripts/compat-previous-release.ts
