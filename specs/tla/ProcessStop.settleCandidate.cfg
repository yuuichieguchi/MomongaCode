SPECIFICATION FairSpec

CONSTANTS
    Members = {m1, m2}
    Events = {"guard", "sweep", "startup", "shutdown"}
    MaxAttempts = 4
    Variant = "settleCandidate"

INVARIANTS
    TypeOK
    NoThrow
    NoSignalToUnprovedGroup
    OutcomeIsTruthful
    MarkerKeptWhileMembersRemain
    RemovalSafe
    NoteOnlyWhileRunning
    NoLongerRunningOnlyWhenClear
    NoRunningClaimAfterListFailure
    OneRetryPerEvent
    AtMostFourRetries

PROPERTIES
    ExhaustedIsFinal
    TeardownOnlyFreed
    SurvivorReachesNotice
