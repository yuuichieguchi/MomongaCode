SPECIFICATION FairSpec

CONSTANTS
    Members = {m1, m2}
    Events = {"guard", "sweep", "startup", "shutdown"}
    MaxAttempts = 4
    Variant = "settleCandidate"
    StopScope = "userStop"
    Gen2Members = {}
    CrossGen = FALSE

INVARIANTS
    TypeOK
    NoThrow
    NoSignalToUnprovedGroup
    OutcomeIsTruthful
    MarkerKeptWhileMembersRemain
    RemovalSafe
    RefuseOnlyOnPositiveEvidence
    FinalNoticeOnlyWhenHeldOrPositive
    NoLongerRunningOnlyWhenClear
    NoRunningClaimAfterListFailure
    OneRetryPerEvent
    AtMostFourRetries

PROPERTIES
    ExhaustedIsFinal
    TeardownOnlyFreed
    SurvivorReachesNotice
