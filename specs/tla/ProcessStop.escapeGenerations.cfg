SPECIFICATION Spec

CONSTANTS
    Members = {m1, m2}
    Events = {"guard", "sweep", "startup", "shutdown"}
    MaxAttempts = 2
    Variant = "decided"
    StopScope = "retire"
    Gen2Members = {m2}
    SameSecondReuse = TRUE
    Escape = TRUE

INVARIANTS
    TypeOK
    NoThrow
    NoSignalToUnprovedGroup
    OutcomeIsTruthful
    MarkerKeptWhileMembersRemain
    UnprovedEndsUnconfirmed
    OneRetryPerEvent
    AtMostFourRetries

PROPERTIES
    NoSignalToNonHolder
    FinishSeesEveryHolder
    ExhaustedIsFinal
    UnconfirmedOnlyWhileOneCanRun
    ListFailureSaysUnlisted
    NoWordFromFailedListing
