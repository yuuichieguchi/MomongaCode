SPECIFICATION Spec

CONSTANTS
    Members = {m1, m2}
    Events = {"guard", "sweep", "startup", "shutdown"}
    MaxAttempts = 2
    Variant = "decided"
    StopScope = "retire"
    Gen2Members = {m2}
    CrossGen = TRUE

INVARIANTS
    TypeOK
    NoThrow
    NoSignalToUnprovedGroup
    OutcomeIsTruthful
    MarkerKeptWhileMembersRemain
    OneRetryPerEvent
    AtMostFourRetries

PROPERTIES
    NoSignalToNonHolder
    StopNeverSignalsOtherGen
    ExhaustedIsFinal
