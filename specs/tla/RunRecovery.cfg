SPECIFICATION Spec

CONSTANTS
    Workers = {w1, w2}
    NoOwner = NoOwner
    MaxStep = 1
    MaxAttempts = 2
    MaxTotalAttempts = 3
    EffectFenced = FALSE
    ReapBeforeReconcile = FALSE
    ParentCalls = {"none", "exec", "rec"}

SYMMETRY WorkerSymmetry

INVARIANTS
    TypeOK
    ContiguousEvents
    AtMostOnePendingApproval
    NoStaleAppend
    OneResponsePerStep
    RecordedResponseNeverReRequested
    TerminalHasNoPendingApproval
    ParentWakeNeverLost
    UnknownNeverRetried
    AtMostOnceEffect
    OnlyDeclaredEdges

PROPERTIES
    TerminalNeverChanges
    EventsAppendOnly
