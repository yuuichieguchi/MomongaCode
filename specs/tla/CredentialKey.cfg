SPECIFICATION Spec

CONSTANTS
    Writers = {w1, w2}
    Readers = {r1}
    MaxNames = 3
    MaxCrash = 2
    Attempts = 2
    Toggles = 2
    CanRemove = FALSE
    OsStore = TRUE
    Variant = "decided"

CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    RecordsReadable
    KeyBeforeRecord
    MarkerImpliesKey
    UnreadableNeverRecreates
    OsWaitHasExit
    DoneReleasesLock

PROPERTIES
    MarkerWrittenOnce
    NoPlaintextUnlessOptIn
    FailureLeavesNoTrace
    ReaderChangesNothing
