    MaxStep = 2
    MaxAttempts = 2
    MaxTotalAttempts = 3
    UnfencedEffect = FALSE
    NoCallLock = FALSE
    NoReapBeforeReconcile = FALSE
    StatusEdgesRecorded = TRUE
