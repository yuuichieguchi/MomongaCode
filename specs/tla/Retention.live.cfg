SPECIFICATION LiveSpec

CONSTANTS
    Sessions = {s1, s2}
    Days = 1
    MaxNow = 2
    MaxCrashes = 1
    MaxSkew = 0
    UseClosure = TRUE
    Record = TRUE
    LockedBlobs = TRUE
    FromActivity = TRUE
    PerStoreSweep = FALSE
    DeleteWhileRead = FALSE

PROPERTIES
    ExpiredClosureDeleted
    DeletionCompletes
    UnownedBlobCollected

CHECK_DEADLOCK FALSE
