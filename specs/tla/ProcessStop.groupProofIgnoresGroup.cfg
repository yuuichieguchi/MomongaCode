SPECIFICATION Spec

CONSTANTS
    Members = {m1, m2}
    Events = {"guard", "sweep", "startup", "shutdown"}
    MaxAttempts = 2
    Variant = "groupProofIgnoresGroup"
    StopScope = "userStop"
    Gen2Members = {}
    SameSecondReuse = FALSE
    Escape = TRUE

INVARIANTS
    TypeOK
    NoThrow
    NoSignalToUnprovedGroup
    OutcomeIsTruthful
    MarkerKeptWhileMembersRemain
    UnprovedEndsUnconfirmed
    OneRetryPerEvent
    AtMostFourRetries

PROPERTIES
    NoSignalToNonHolder
    FinishSeesEveryHolder
    ExhaustedIsFinal
    UnconfirmedOnlyWhileOneCanRun
