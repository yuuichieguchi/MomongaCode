SPECIFICATION Spec

CONSTANTS
    Keys = {k1, k2}
    MaxProbes = 4
    MaxRequests = 4
    MaxKeyChanges = 2
    MaxCrashes = 1
    MaxCancels = 1
    SingleFlight = "shared"
    KeyView = "perRequest"
    ReadRecord = "fresh"
    Guess = FALSE
    Reject412 = FALSE
    FailWrites = FALSE
    TaintCheck = TRUE
    Manual = TRUE
    Adapter = "endpoint"
    EndpointLocked = TRUE
    PreconditionCheck = TRUE
    Backoff = TRUE
    MaxRefusalChanges = 1

INVARIANTS
    TypeOK
    SingleProbePerKey
    NoGuessedAnswer
    NoRecordGets503
    RetryAfterIsHonest
    RecordSeenAtOnce
    FailedWritesNothing
    RecordMatchesKey
    RecordIsClean
    RefusalGetsRemedy
    NoProbeInBackoff
    RecordUnderLock

CHECK_DEADLOCK FALSE
